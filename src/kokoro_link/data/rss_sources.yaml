  # Hosted default pack (2026-07-26 owner selection).
  #
  # Two halves with different region semantics:
  #
  #  * JP pack (region: JP) — outlets whose day-to-day coverage is
  #    Japanese domestic life. A hosted player in Taiwan gets no value
  #    from NHK's 主要ニュース rundown, so these are curated only into
  #    JP players' pools (plus ``nhk-easy`` above, same pack).
  #  * Global pack (no region) — international wires plus science and
  #    technology coverage a reader anywhere can use. Do NOT tag these
  #    US just because they publish in en-US; region is who the content
  #    is for, not where the newsroom sits.
  - id: nhk-science
    name: NHK 科学・医療
    feed_url: https://www3.nhk.or.jp/rss/news/cat3.xml
    category: science
    locale: ja-JP
    region: JP
    enabled: true

