# Default RSS source registry.
#
# Synced into the ``rss_sources`` table on application startup
# (RssSourceSyncService). Operator can disable / delete entries via
# admin API; on next restart the seed file does NOT re-create
# operator-deleted rows (id-based: missing-from-yaml leaves the DB row
# alone; present-in-yaml UPSERTs the canonical fields). See
# ``RssSourceSyncService`` for the exact merge rules.
#
# Categories must match ``RssCategory`` constants: news / emergency /
# weather / tech / gaming / anime / entertainment / lifestyle / food /
# travel / health / science / education / sports / culture / finance.
#
# locale is informational — used by prompt-fact rendering and (soon)
# per-character locale preferences. Free-form, but use BCP-47
# (zh-TW / ja-JP / en-US ...).
#
# region (optional, TW / JP / US ...) declares that a source's content is
# only meaningful to people living in that place. OMIT IT for anything a
# reader anywhere could care about — that is the common case, and an
# over-tagged pool silently starves players in small regions.
#
# It does two things:
#
#  1. Curation (all categories): a character is only offered events from
#     region-less sources plus its own player's region, so a player in
#     Japan never reads Taiwanese local news. A player with no country on
#     their profile — the self-host default — is never filtered, so
#     self-host behaviour is exactly as it was before the field existed.
#     Persisted per source and editable in Admin → World events; the seed
#     only backfills rows that have no region yet.
#  2. Emergency seeding: a region-bound ``emergency`` feed is seeded
#     ENABLED only when the deployment region matches, otherwise disabled
#     (civil alerts are noise for an overseas self-host). This gate binds
#     to region/timezone, NOT language — an en-US operator living in
#     Taiwan still wants Taiwan alerts.
#
# region is orthogonal to locale: locale is the language the feed
# publishes in, region is who the content is *for*. A Taiwanese agency
# reporting world news in zh-TW is locale zh-TW + region TW; a Japanese
# outlet covering anime that fans read worldwide is locale ja-JP with no
# region at all.

sources:
  - id: bbc-world
    name: BBC World
    feed_url: https://feeds.bbci.co.uk/news/world/rss.xml
    category: news
    locale: en-GB
    enabled: true

  - id: cna-realtime
    name: 中央社即時新聞
    feed_url: https://feeds.feedburner.com/rsscna/intworld
    category: news
    locale: zh-TW
    region: TW
    enabled: true

  # NHK 主要ニュース (cat0). Shipped under the legacy ``nhk-easy`` id —
  # renaming the id would strand the existing DB row (the seed never
  # deletes) and poll the same URL twice, so only the display name moved.
  # region: JP — Japanese domestic headlines are for people living there;
  # see the hosted default pack note at the bottom of this file.
  - id: nhk-easy
    name: NHK 主要ニュース
    feed_url: https://www3.nhk.or.jp/rss/news/cat0.xml
    category: news
    locale: ja-JP
    region: JP
    enabled: true

  - id: ncdr-all-alerts
    name: 民生示警公開資料平台
    feed_url: https://alerts.ncdr.nat.gov.tw/RssAtomFeed.ashx
    category: emergency
    locale: zh-TW
    # Geographic civil-alert feed — Taiwan-only. ``region`` binds it to
    # the deployment region (not language): auto-enabled only when the
    # deployment region is TW, otherwise seeded disabled (an overseas
    # self-host gets no meaningless Taiwan alerts). Operator can enable
    # it manually from the admin UI. See RssSourceSyncService.
    region: TW
    enabled: true

  - id: ithome-news
    name: iThome 新聞
    feed_url: https://www.ithome.com.tw/rss
    category: tech
    locale: zh-TW
    region: TW
    enabled: true

