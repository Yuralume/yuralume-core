# Fantasy dramatic seeds — batch b1.
#
# Tension hooks for fantasy-frame characters: enough to open a scene,
# never enough to close one. The expander LLM adapts occupation,
# geography and stakes to the character's own world; seeds only name
# roles (旅人、貴族、長輩), never persons or IP, and never decide how
# the player reacts or how the story ends.
pack_id: fantasy_dramatic_b1
language: zh-TW

seeds:
