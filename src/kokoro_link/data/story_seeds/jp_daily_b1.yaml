# Japan-flavored daily seeds (batch 1).
#
# Low-stakes everyday micro-events with Japanese cultural texture
# (school life, vending machines, summer festivals, convenience
# stores, trains). Seed text stays zh-TW — the expander LLM adapts
# details to the character's voice + world.
#
# Format per entry:
#   external_id  : stable id for idempotent re-import (must be unique
#                  across all packs). Convention: ``<pack>:<category>:<n>``.
#   seed_text    : one-line zh-TW prompt.
#   tags         : descriptive labels (no vocabulary enforced).
#   world_frames : which frames this seed fits.
#   tier         : daily (micro-event, resolvable in 2-3 sentences).
#   regions      : locale gating for the draw pool.
#   weight       : relative draw weight.
#   cooldown_days: minimum days between the same seed for one character.
