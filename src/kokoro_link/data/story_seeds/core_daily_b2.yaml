# Core daily seeds — batch 2 (cdb2).
#
# Universal across every ``world_frame`` — inner life, emotions, senses,
# body states, small discoveries, small wins, and gentle social ripples.
# No modern-only props (phones, transit, electricity-as-word); phrasing
# stays setting-agnostic so the expander can adapt to any world.
#
# Tier: daily only. Low stakes, no conflict escalation, resolvable in a
# 2-3 sentence beat. Emotion range covers mild positives and negatives.
#
# Format per entry:
#   external_id  : cdb2:<category>:<nnn> — unique across all packs.
#   seed_text    : one-line zh-TW semantic prompt for the expander.
#   tags         : free-vocabulary labels.
#   world_frames : [any] for this pack.
#   tier         : daily for this pack.
#   regions      : [global] for this pack.
#   weight       : 0.5-0.8 (daily band).
#   cooldown_days: >= 60 (two-month no-repeat invariant).
pack_id: core_daily_b2
language: zh-TW

