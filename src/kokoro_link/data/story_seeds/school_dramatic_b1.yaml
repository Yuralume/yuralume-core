# School dramatic seeds — batch b1.
#
# Tension hooks for school-frame characters: classroom politics,
# friendships under strain, secrets and countdowns. Each seed opens
# a scene without deciding the player's reaction or the outcome.
# The expander LLM adapts grade, club and campus details to the
# character's own school life; no names, no IP, no endings.
