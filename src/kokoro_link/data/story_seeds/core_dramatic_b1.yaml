# Core dramatic story seeds — batch 1 (seed-harvest-b1).
#
# Frame-agnostic tension hooks: each seed opens a scene without deciding
# the player's reaction or playing out the resolution. The expander LLM
# adapts details to the character's voice + world. No modern tech, no
# named people, no IP.
#
# tier: dramatic — lower weight, longer cooldown than daily seeds.
pack_id: core_dramatic_b1
language: zh-TW

seeds:
